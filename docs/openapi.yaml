components:
  schemas:
    Error:
      properties:
        errorCode:
          description: |
            A 5-digit error code uniquely identifying this particular type of error.
          example: 40149
          type: "number"
        message:
          description: "Message describing the error."
          example: "A brief description of the error."
          type: "string"
      type: "object"
    NoteJson:
      properties:
        backlinks:
          description: "Vault-relative paths of files that link to this file."
          items:
            type: "string"
          type: "array"
        content:
          type: "string"
        frontmatter:
          type: "object"
        links:
          description: "Vault-relative paths of files this file links to."
          items:
            type: "string"
          type: "array"
        path:
          type: "string"
        stat:
          properties:
            ctime:
              type: "number"
            mtime:
              type: "number"
            size:
              type: "number"
          required:
            - "ctime"
            - "mtime"
            - "size"
          type: "object"
        tags:
          items:
            type: "string"
          type: "array"
      required:
        - "tags"
        - "frontmatter"
        - "stat"
        - "path"
        - "content"
        - "links"
        - "backlinks"
      type: "object"
  securitySchemes:
    apiKeyAuth:
      description: |
        Find your API Key in your Obsidian settings
        in the "Local REST API" section under "Plugins".
      scheme: "bearer"
      type: "http"
info:
  description: |
    The Obsidian Local REST API & MCP Server plugin gives you two ways to interact with your Obsidian vault programmatically:
    
    - **REST API** — standard HTTP endpoints for reading and writing notes, searching vault contents, managing periodic notes, and more. Useful from scripts, applications, or any HTTP client.
    - **MCP server** — exposes the same capabilities as structured tools for AI assistants (Claude, Cursor, and other MCP-compatible clients). See the `POST /mcp/` endpoint for connection details.
    
    ## Testing with this interface
    
    Select any operation in the sidebar, then open the **Try It** tab to send a live request to your running Obsidian instance.
    
    **Authentication** — all requests require a Bearer token. In the **Try It** panel, expand the **Security** section and paste the API key shown in Obsidian under **Settings → Local REST API & MCP Server**.
    
    **Certificate warning** — the plugin generates a self-signed TLS certificate on first run. Most browsers will block requests to an untrusted certificate, so you may need to add it as a trusted certificate in your OS or browser settings before requests will go through. The steps vary by environment — search for "trust self-signed certificate" plus your OS or browser name if you're unsure. If that proves too cumbersome, you can enable the insecure HTTP server in your plugin settings instead and select "HTTP (insecure mode)" from the **Try It** section.
  title: "Local REST API for Obsidian"
  version: "1.0"
openapi: "3.0.2"
paths:
  /:
    get:
      description: |
        Returns basic details about the server as well as your authentication status.
        
        This is the only API request that does *not* require authentication.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  authenticated:
                    description: "Is your current request authenticated?"
                    type: "boolean"
                  ok:
                    description: "'OK'"
                    type: "string"
                  service:
                    description: "'Obsidian Local REST API'"
                    type: "string"
                  versions:
                    properties:
                      obsidian:
                        description: "Obsidian plugin API version"
                        type: "string"
                      self:
                        description: "Plugin version."
                        type: "string"
                    type: "object"
                type: "object"
          description: "Success"
      summary: |
        Returns basic details about the server.
      tags:
        - "System"
  /active/:
    delete:
      parameters: []
      responses:
        "204":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File does not exist."
        "405":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: |
            Your path references a directory instead of a file; this request method is valid only for updating files.
      summary: |
        Deletes the currently-active file in Obsidian.
      tags:
        - "Active File"
    get:
      description: |
        Returns the content of the currently active file in Obsidian.
        
        # Targeting a Sub-part of your Document
        
        You can operate on a specific section of a note instead of the whole file by providing `Target-Type` and `Target` headers:
        
        - Set `Target-Type` to `heading`, `block`, or `frontmatter`. When `Target-Type` is `heading`, the operation applies to the body content *beneath* that heading line — the heading line itself (`## My Section`) is not part of the section and should not appear in the patched content.
        - Set `Target` to the name of the heading, block reference, or frontmatter field. If the target contains non-ASCII characters (e.g. accented letters), percent-encode the value (e.g. `H%C3%A9llo` for `Héllo`).
        - For nested headings, use the `Target-Delimiter` header (default `::`) to separate levels.
        
        You can also embed the target type and target directly in the URL path after the note identifier instead of using headers. The segment immediately following the note identifier is the target type, and the remaining segments form the target:
        
        - `.../heading/My%20Section` is equivalent to supplying `Target-Type: heading` and `Target: My%20Section`.
        - For nested headings, add additional path segments: `.../heading/My%20Section/Subsection` is equivalent to `Target: My%20Section::Subsection`.
        - `.../frontmatter/fieldName` targets the `fieldName` frontmatter field.
        - `.../block/abc123` targets the block with reference ID `abc123`.
        
        Do not combine URL-embedded targeting with `Target-Type`, `Target`, or `Target-Delimiter` headers in the same request. If both are provided, the request fails with `422 ConflictingTargetSpecification`.
        
        ## Target-Scope
        
        For `heading` and `block` targets, the optional `Target-Scope` header controls which portion of the target the operation acts on:
        
        - `content` (default): the operation applies to the content region — the area beneath the heading line or at the block, leaving the heading/block-ID token unchanged.
        - `marker`: the operation applies only to the heading line or block-ID token itself, leaving the content unchanged. Useful for renaming a heading in-place with a `replace` operation without touching the section content.
        - `markerAndContent`: the operation applies to the full range covering both the heading/block-ID token and its content, allowing them to be replaced or repositioned together.
        
        # Retrieving Document Metadata
        
        ## Metadata
        
        If you specify the header `Accept: application/vnd.olrapi.note+json`, will return a JSON representation of your note including parsed tag and frontmatter data as well as filesystem metadata.
        
        ## Document Map
        
        If you specify the header `Accept: application/vnd.olrapi.document-map+json`, will return a JSON object outlining what PATCH targets exist. See "responses" below for details.
      parameters:
        - description: |
            Type of sub-document section to target. When specified, the operation
            applies only to the matching section rather than the whole file. Must
            be used together with the `Target` header.
            
            - `heading`: a markdown heading section.
            - `block`: a block reference.
            - `frontmatter`: a frontmatter field.
          in: "header"
          name: "Target-Type"
          required: false
          schema:
            enum:
              - "heading"
              - "block"
              - "frontmatter"
            type: "string"
        - description: |
            The section to target; required when `Target-Type` is specified.
            This value can be URL-Encoded and *must* be URL-Encoded if it
            includes non-ASCII characters.
          in: "header"
          name: "Target"
          required: false
          schema:
            type: "string"
        - description: "Delimiter used when specifying nested heading targets (e.g. \"Heading 1::Subheading\"). Defaults to \"::\"."
          in: "header"
          name: "Target-Delimiter"
          required: false
          schema:
            default: "::"
            type: "string"
      responses:
        "200":
          content:
            application/json:
              description: "Returned when `Target-Type` is `frontmatter`; the JSON value of the specified frontmatter field."
              schema: {}
            "application/vnd.olrapi.document-map+json":
              schema:
                properties:
                  blocks:
                    example:
                      - "^blockref1"
                      - "^anotherBlockRef"
                    items:
                      type: "string"
                    type: "array"
                  frontmatterFields:
                    example:
                      - "title"
                      - "tags"
                      - "dateCreated"
                    items:
                      type: "string"
                    type: "array"
                  headings:
                    example:
                      - "Heading 1"
                      - "Heading 1::Subhead of Heading 1"
                      - "Heading 2"
                    items:
                      type: "string"
                    type: "array"
                type: "object"
            "application/vnd.olrapi.note+json":
              schema:
                "$ref": "#/components/schemas/NoteJson"
            text/markdown:
              schema:
                example: |
                  # This is my document
                  
                  something else here
                type: "string"
          description: "Success"
        "404":
          description: "File or target section does not exist"
      summary: |
        Return the content of the active file open in Obsidian.
      tags:
        - "Active File"
    patch:
      description: |
        Inserts content into the currently-open note relative to a heading, block reference, or frontmatter field within that document.
        
        Allows you to modify the content relative to a heading, block reference, or frontmatter field in your document.
        
        # How to Use & Examples
        
        All of the below examples assume you have a document that looks like
        this:
        
        ```markdown
        ---
        alpha: 1
        beta: test
        delta:
        zeta: 1
        yotta: 1
        gamma:
        - one
        - two
        ---
        
        # Heading 1
        
        This is the content for heading one
        
        Also references some [[#^484ef2]]
        
        ## Subheading 1:1
        Content for Subheading 1:1
        
        ### Subsubheading 1:1:1
        
        ### Subsubheading 1:1:2
        
        Testing how block references work for a table.[[#^2c7cfa]]
        Some content for Subsubheading 1:1:2
        
        More random text.
        
        ^2d9b4a
        
        ## Subheading 1:2
        
        Content for Subheading 1:2.
        
        some content with a block reference ^484ef2
        
        ## Subheading 1:3
        | City         | Population |
        | ------------ | ---------- |
        | Seattle, WA  | 8          |
        | Portland, OR | 4          |
        
        ^2c7cfa
        ```
        
        ## Append, Prepend, or Replace Content Below a Heading
        
        If you wanted to append the content "Hello" below "Subheading 1:1:1" under "Heading 1",
        you could send a request with the following headers:
        
        - `Operation`: `append`
        - `Target-Type`: `heading`
        - `Target`: `Heading 1::Subheading 1:1:1` (percent-encode any non-ASCII characters, e.g. `H%C3%A9llo` for `Héllo`)
        - with the request body: `Hello`
        
        The above would work just fine for `prepend` or `replace`, too, of course,
        but with different results.
        
        > **Note:** The heading line itself (`### Subsubheading 1:1:1`) is not part of the section content. When using `replace`, supply only the body text that should appear beneath the heading — do not include the heading line in the request body, or it will be duplicated.
        
        ## Append, Prepend, or Replace Content to a Block Reference
        
        If you wanted to append the content "Hello" below the block referenced by
        "2d9b4a" above ("More random text."), you could send the following headers:
        
        - `Operation`: `append`
        - `Target-Type`: `block`
        - `Target`: `2d9b4a`
        - with the request body: `Hello`
        
        The above would work just fine for `prepend` or `replace`, too, of course,
        but with different results.
        
        ## Append, Prepend, or Replace a Row or Rows to/in a Table Referenced by a Block Reference
        
        If you wanted to add a new city ("Chicago, IL") and population ("16") pair to the table above
        referenced by the block reference `2c7cfa`, you could send the following
        headers:
        
        - `Operation`: `append`
        - `Target-Type`: `block`
        - `Target`: `2c7cfa`
        - `Content-Type`: `application/json`
        - with the request body: `[["Chicago, IL", "16"]]`
        
        The use of a `Content-Type` of `application/json` allows the API
        to infer that member of your array represents rows and columns of your
        to append to the referenced table.  You can of course just use a
        `Content-Type` of `text/markdown`, but in such a case you'll have to
        format your table row manually instead of letting the library figure
        it out for you.
        
        You also have the option of using `prepend` (in which case, your new
        row would be the first -- right below the table heading) or `replace` (in which
        case all rows except the table heading would be replaced by the new row(s)
        you supplied).
        
        ## Setting a Frontmatter Field
        
        If you wanted to set the frontmatter field `alpha` to `2`, you could
        send the following headers:
        
        - `Operation`: `replace`
        - `Target-Type`: `frontmatter`
        - `Target`: `beep`
        - with the request body `2`
        
        If you're setting a frontmatter field that might not already exist
        you may want to use the `Create-Target-If-Missing` header so the
        new frontmatter field is created and set to your specified value
        if it doesn't already exist.
        
        You may find using a `Content-Type` of `application/json` to be
        particularly useful in the case of frontmatter since frontmatter
        fields' values are JSON data, and the API can be smarter about
        interpreting your `prepend` or `append` requests if you specify
        your data as JSON (particularly when appending, for example,
        list items).
        
        ## Adding and Removing Tags
        
        Obsidian stores tags in two places: the `tags` frontmatter field and as
        inline `#tag` syntax in the document body. You can manage frontmatter tags
        with the PATCH API.
        
        ### Adding a tag
        
        To add the tag `project/active` to a document's frontmatter `tags` list:
        
        - `Operation`: `append`
        - `Target-Type`: `frontmatter`
        - `Target`: `tags`
        - `Content-Type`: `application/json`
        - `Create-Target-If-Missing`: `true`
        - with the request body: `["project/active"]`
        
        Passing an array as `application/json` tells the API to merge individual
        items into the existing list rather than replace the whole field.
        `Create-Target-If-Missing` ensures the `tags` key is created when the
        document has no frontmatter tags yet.
        
        ### Removing a tag
        
        There is no direct "remove item from list" operation. To remove a tag,
        first read the current tags via GET (or `vault_read` in the MCP API),
        filter out the unwanted tag client-side, then replace the entire field:
        
        - `Operation`: `replace`
        - `Target-Type`: `frontmatter`
        - `Target`: `tags`
        - `Content-Type`: `application/json`
        - with the request body: `["remaining-tag-1", "remaining-tag-2"]`
        
        ## Identifying Patch Targets in a File
        
        You can issue a GET request to `/vault/files/{path}` with an `Accept` header
        of `application/vnd.olrapi.document-map+json` to get a JSON object
        outlining what headings, block references, and frontmatter fields exist.
      parameters:
        - description: "Patch operation to perform"
          in: "header"
          name: "Operation"
          required: true
          schema:
            enum:
              - "append"
              - "prepend"
              - "replace"
            type: "string"
        - description: "If the specified Target does not exist, create it?"
          in: "header"
          name: "Create-Target-If-Missing"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: "If patch data already exists in Target, reject the patch?"
          in: "header"
          name: "Reject-If-Content-Preexists"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: "Trim whitespace from Target content before applying the operation?"
          in: "header"
          name: "Trim-Target-Whitespace"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: |
            Controls which part of the target the operation acts on. Only applicable to
            `heading` and `block` targets; ignored for `frontmatter`.
            
            - `content` (default): the operation applies to the content region only — the area
              below the heading line or at the block, leaving the heading/block-ID token unchanged.
            - `marker`: the operation applies only to the heading line or block-ID token itself,
              leaving the content unchanged.
            - `markerAndContent`: the operation applies to the full range covering both the
              heading/block-ID token and its content, allowing them to be replaced or repositioned
              together.
          in: "header"
          name: "Target-Scope"
          required: false
          schema:
            default: "content"
            enum:
              - "content"
              - "marker"
              - "markerAndContent"
            type: "string"
        - description: |
            Type of sub-document section to target. When specified, the operation
            applies only to the matching section rather than the whole file. Must
            be used together with the `Target` header.
            
            - `heading`: a markdown heading section.
            - `block`: a block reference.
            - `frontmatter`: a frontmatter field.
          in: "header"
          name: "Target-Type"
          required: true
          schema:
            enum:
              - "heading"
              - "block"
              - "frontmatter"
            type: "string"
        - description: |
            The section to target; required when `Target-Type` is specified.
            This value can be URL-Encoded and *must* be URL-Encoded if it
            includes non-ASCII characters.
          in: "header"
          name: "Target"
          required: true
          schema:
            type: "string"
        - description: "Delimiter used when specifying nested heading targets (e.g. \"Heading 1::Subheading\"). Defaults to \"::\"."
          in: "header"
          name: "Target-Delimiter"
          required: false
          schema:
            default: "::"
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              example: "['one', 'two']"
              type: "string"
          text/markdown:
            schema:
              example: |
                # This is my document
                
                something else here
              type: "string"
        description: "Content you would like to insert."
        required: true
      responses:
        "200":
          description: "Success"
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad Request; see response message for details."
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Does not exist"
        "405":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: |
            Your path references a directory instead of a file; this request method is valid only for updating files.
      summary: |
        Partially update content in the currently open note.
      tags:
        - "Active File"
    post:
      description: |
        Appends content to the end of the currently-open note.
        
        # Targeting a Sub-part of your Document
        
        You can operate on a specific section of a note instead of the whole file by providing `Target-Type` and `Target` headers:
        
        - Set `Target-Type` to `heading`, `block`, or `frontmatter`. When `Target-Type` is `heading`, the operation applies to the body content *beneath* that heading line — the heading line itself (`## My Section`) is not part of the section and should not appear in the patched content.
        - Set `Target` to the name of the heading, block reference, or frontmatter field. If the target contains non-ASCII characters (e.g. accented letters), percent-encode the value (e.g. `H%C3%A9llo` for `Héllo`).
        - For nested headings, use the `Target-Delimiter` header (default `::`) to separate levels.
        
        You can also embed the target type and target directly in the URL path after the note identifier instead of using headers. The segment immediately following the note identifier is the target type, and the remaining segments form the target:
        
        - `.../heading/My%20Section` is equivalent to supplying `Target-Type: heading` and `Target: My%20Section`.
        - For nested headings, add additional path segments: `.../heading/My%20Section/Subsection` is equivalent to `Target: My%20Section::Subsection`.
        - `.../frontmatter/fieldName` targets the `fieldName` frontmatter field.
        - `.../block/abc123` targets the block with reference ID `abc123`.
        
        Do not combine URL-embedded targeting with `Target-Type`, `Target`, or `Target-Delimiter` headers in the same request. If both are provided, the request fails with `422 ConflictingTargetSpecification`.
        
        ## Target-Scope
        
        For `heading` and `block` targets, the optional `Target-Scope` header controls which portion of the target the operation acts on:
        
        - `content` (default): the operation applies to the content region — the area beneath the heading line or at the block, leaving the heading/block-ID token unchanged.
        - `marker`: the operation applies only to the heading line or block-ID token itself, leaving the content unchanged. Useful for renaming a heading in-place with a `replace` operation without touching the section content.
        - `markerAndContent`: the operation applies to the full range covering both the heading/block-ID token and its content, allowing them to be replaced or repositioned together.
        
        When a target is specified the content is appended within that section and the full updated file content is returned with a `200` status. Without a target, the content is appended to the end of the file and a `204` status is returned.
        
        If you need `prepend` or `replace` operations, use `PATCH` instead.
      parameters:
        - description: "If the specified Target does not exist, create it?"
          in: "header"
          name: "Create-Target-If-Missing"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: "If patch data already exists in Target, reject the patch?"
          in: "header"
          name: "Reject-If-Content-Preexists"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: "Trim whitespace from Target content before applying the operation?"
          in: "header"
          name: "Trim-Target-Whitespace"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: |
            Type of sub-document section to target. When specified, the operation
            applies only to the matching section rather than the whole file. Must
            be used together with the `Target` header.
            
            - `heading`: a markdown heading section.
            - `block`: a block reference.
            - `frontmatter`: a frontmatter field.
          in: "header"
          name: "Target-Type"
          required: false
          schema:
            enum:
              - "heading"
              - "block"
              - "frontmatter"
            type: "string"
        - description: |
            The section to target; required when `Target-Type` is specified.
            This value can be URL-Encoded and *must* be URL-Encoded if it
            includes non-ASCII characters.
          in: "header"
          name: "Target"
          required: false
          schema:
            type: "string"
        - description: "Delimiter used when specifying nested heading targets (e.g. \"Heading 1::Subheading\"). Defaults to \"::\"."
          in: "header"
          name: "Target-Delimiter"
          required: false
          schema:
            default: "::"
            type: "string"
      requestBody:
        content:
          text/markdown:
            schema:
              example: |
                # This is my document
                
                something else here
              type: "string"
        description: "Content you would like to append."
        required: true
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: "string"
          description: "Success; targeted section updated. The full updated file content is returned."
        "204":
          description: "Success; content appended to end of file."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad Request"
        "405":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: |
            Your path references a directory instead of a file; this request method is valid only for updating files.
      summary: |
        Append content to the active file open in Obsidian.
      tags:
        - "Active File"
    put:
      description: |
        # Targeting a Sub-part of your Document
        
        You can operate on a specific section of a note instead of the whole file by providing `Target-Type` and `Target` headers:
        
        - Set `Target-Type` to `heading`, `block`, or `frontmatter`. When `Target-Type` is `heading`, the operation applies to the body content *beneath* that heading line — the heading line itself (`## My Section`) is not part of the section and should not appear in the patched content.
        - Set `Target` to the name of the heading, block reference, or frontmatter field. If the target contains non-ASCII characters (e.g. accented letters), percent-encode the value (e.g. `H%C3%A9llo` for `Héllo`).
        - For nested headings, use the `Target-Delimiter` header (default `::`) to separate levels.
        
        You can also embed the target type and target directly in the URL path after the note identifier instead of using headers. The segment immediately following the note identifier is the target type, and the remaining segments form the target:
        
        - `.../heading/My%20Section` is equivalent to supplying `Target-Type: heading` and `Target: My%20Section`.
        - For nested headings, add additional path segments: `.../heading/My%20Section/Subsection` is equivalent to `Target: My%20Section::Subsection`.
        - `.../frontmatter/fieldName` targets the `fieldName` frontmatter field.
        - `.../block/abc123` targets the block with reference ID `abc123`.
        
        Do not combine URL-embedded targeting with `Target-Type`, `Target`, or `Target-Delimiter` headers in the same request. If both are provided, the request fails with `422 ConflictingTargetSpecification`.
        
        ## Target-Scope
        
        For `heading` and `block` targets, the optional `Target-Scope` header controls which portion of the target the operation acts on:
        
        - `content` (default): the operation applies to the content region — the area beneath the heading line or at the block, leaving the heading/block-ID token unchanged.
        - `marker`: the operation applies only to the heading line or block-ID token itself, leaving the content unchanged. Useful for renaming a heading in-place with a `replace` operation without touching the section content.
        - `markerAndContent`: the operation applies to the full range covering both the heading/block-ID token and its content, allowing them to be replaced or repositioned together.
        
        When a target is specified the target section is replaced with the request body and the full updated file content is returned with a `200` status. If the target does not exist it will be created. Without a target, the entire file is replaced and a `204` status is returned.
      parameters:
        - description: "If patch data already exists in Target, reject the patch?"
          in: "header"
          name: "Reject-If-Content-Preexists"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: "Trim whitespace from Target content before applying the operation?"
          in: "header"
          name: "Trim-Target-Whitespace"
          required: false
          schema:
            default: "false"
            enum:
              - "true"
              - "false"
            type: "string"
        - description: |
            Type of sub-document section to target. When specified, the operation
            applies only to the matching section rather than the whole file. Must
            be used together with the `Target` header.
            
            - `heading`: a markdown heading section.
            - `block`: a block reference.
            - `frontmatter`: a frontmatter field.
          in: "header"
          name: "Target-Type"
          required: false
          schema:
            enum:
              - "heading"
              - "block"
              - "frontmatter"
            type: "string"
        - description: |
            The section to target; required when `Target-Type` is specified.
            This value can be URL-Encoded and *must* be URL-Encoded if it
            includes non-ASCII characters.
          in: "header"
          name: "Target"
          required: false
          schema:
            type: "string"
        - description: "Delimiter used when specifying nested heading targets (e.g. \"Heading 1::Subheading\"). Defaults to \"::\"."
          in: "header"
          name: "Target-Delimiter"
          required: false
          schema:
            default: "::"
            type: "string"
      requestBody:
        content:
          "*/*":
            schema:
              type: "string"
          text/markdown:
            schema:
              example: |
                # This is my document
                
                something else here
              type: "string"
        description: "Content of the file you would like to upload."
        required: true
      responses:
        "200":
          content:
            text/markdown:
              schema:
                type: "string"
          description: "Success; targeted section replaced. The full updated file content is returned."
        "204":
          description: "Success; entire file replaced."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: |
            Incoming file could not be processed.  Make sure you have specified a reasonable file name, and make sure you have set a reasonable 'Content-Type' header; if you are uploading a note, 'text/markdown' is likely the right choice.
        "405":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: |
            Your path references a directory instead of a file; this request method is valid only for updating files.
      summary: |
        Update the content of the active file open in Obsidian.
      tags:
        - "Active File"
  "/blocks/{filename}":
    get:
      description: |
        Returns each block's ID, content (the paragraph containing the block ref), and line number.
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  blocks:
                    items:
                      properties:
                        content:
                          type: "string"
                        id:
                          type: "string"
                        line:
                          type: "number"
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        List all block references in a file.
      tags:
        - "Blocks"
    post:
      description: |
        The block ID is appended to the end of the specified line. Throws if the block ID already exists in the file.
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                blockId:
                  description: "Block reference ID (alphanumeric and hyphens, no ^ prefix)."
                  type: "string"
                line:
                  description: "0-indexed line number to add the block ID to."
                  type: "number"
              required:
                - "line"
                - "blockId"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        Add a block reference ID to a specific line in a note.
      tags:
        - "Blocks"
  "/blocks/{filename}/{blockId}":
    get:
      description: |
        Returns the block ID, its content (the full paragraph), and line number.
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
        - description: "Block reference ID to read (without ^ prefix)."
          in: "path"
          name: "blockId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  content:
                    type: "string"
                  id:
                    type: "string"
                  line:
                    type: "number"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Block or file not found"
      summary: |
        Read the content of a specific block reference in a file.
      tags:
        - "Blocks"
  /canvas/:
    get:
      description: |
        Returns an array of file paths for all canvas files.
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  files:
                    items:
                      type: "string"
                    type: "array"
                type: "object"
          description: "Success"
      summary: |
        List all .canvas files in the vault.
      tags:
        - "Canvas"
    post:
      description: |
        Creates a new canvas file with initial nodes and edges. The path must end with .canvas extension. Follows JSON Canvas spec 1.0.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                edges:
                  description: "Initial edges connecting nodes."
                  items:
                    type: "object"
                  type: "array"
                nodes:
                  description: "Initial nodes to place on the canvas."
                  items:
                    type: "object"
                  type: "array"
                path:
                  description: "Path for the new .canvas file."
                  type: "string"
              required:
                - "path"
              type: "object"
        required: true
      responses:
        "201":
          description: "Created"
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad request"
      summary: |
        Create a new canvas file.
      tags:
        - "Canvas"
  "/canvas/{filename}":
    get:
      description: |
        Returns the full JSON Canvas structure with nodes and edges. Follows JSON Canvas spec 1.0.
      parameters:
        - description: "Path to the .canvas file relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  edges:
                    items:
                      type: "object"
                    type: "array"
                  nodes:
                    items:
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Canvas file not found"
      summary: |
        Read and parse a canvas file.
      tags:
        - "Canvas"
    put:
      description: |
        Replaces all nodes and edges in an existing canvas file.
      parameters:
        - description: "Path to the .canvas file relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                edges:
                  items:
                    type: "object"
                  type: "array"
                nodes:
                  items:
                    type: "object"
                  type: "array"
              required:
                - "nodes"
                - "edges"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Canvas file not found"
      summary: |
        Replace the entire content of a canvas file.
      tags:
        - "Canvas"
  "/canvas/{filename}/edges":
    post:
      description: |
        Edges connect a fromNode to a toNode, optionally specifying sides and arrow endpoints.
      parameters:
        - description: "Path to the .canvas file."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                color:
                  type: "string"
                fromEnd:
                  enum:
                    - "none"
                    - "arrow"
                  type: "string"
                fromNode:
                  type: "string"
                fromSide:
                  enum:
                    - "top"
                    - "right"
                    - "bottom"
                    - "left"
                  type: "string"
                id:
                  type: "string"
                label:
                  type: "string"
                toEnd:
                  enum:
                    - "none"
                    - "arrow"
                  type: "string"
                toNode:
                  type: "string"
                toSide:
                  enum:
                    - "top"
                    - "right"
                    - "bottom"
                    - "left"
                  type: "string"
              required:
                - "id"
                - "fromNode"
                - "toNode"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Canvas file not found"
      summary: |
        Add an edge between two nodes on a canvas.
      tags:
        - "Canvas"
  "/canvas/{filename}/nodes":
    post:
      description: |
        Node types: text (with text content), file (referencing a vault file), link (external URL), group (visual container). Throws if a node with the same ID already exists.
      parameters:
        - description: "Path to the .canvas file."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                color:
                  type: "string"
                file:
                  type: "string"
                height:
                  type: "number"
                id:
                  type: "string"
                label:
                  type: "string"
                text:
                  type: "string"
                type:
                  enum:
                    - "text"
                    - "file"
                    - "link"
                    - "group"
                  type: "string"
                url:
                  type: "string"
                width:
                  type: "number"
                x:
                  type: "number"
                "y":
                  type: "number"
              required:
                - "id"
                - "type"
                - "x"
                - "y"
                - "width"
                - "height"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Canvas file not found"
      summary: |
        Add a node to an existing canvas.
      tags:
        - "Canvas"
  "/canvas/{filename}/nodes/{nodeId}":
    delete:
      description: |
        Also removes all edges connected to the deleted node.
      parameters:
        - description: "Path to the .canvas file."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
        - description: "ID of the node to delete."
          in: "path"
          name: "nodeId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Canvas file not found"
      summary: |
        Remove a node from a canvas by its ID.
      tags:
        - "Canvas"
  /commands/:
    get:
      responses:
        "200":
          content:
            application/json:
              example:
                commands:
                  - id: "global-search:open"
                    name: "Search: Search in all files"
                  - id: "graph:open"
                    name: "Graph view: Open graph view"
              schema:
                properties:
                  commands:
                    items:
                      properties:
                        id:
                          type: "string"
                        name:
                          type: "string"
                      type: "object"
                    type: "array"
                type: "object"
          description: "A list of available commands."
      summary: |
        Get a list of available commands.
      tags:
        - "Commands"
  "/commands/{commandId}/":
    post:
      parameters:
        - description: "The id of the command to execute"
          in: "path"
          name: "commandId"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "The command you specified does not exist."
      summary: |
        Execute a command.
      tags:
        - "Commands"
  /graph/:
    get:
      description: |
        Each node includes path, name, tags, link count, and backlink count. Each edge represents a wiki-link from source to target. Use the optional `filter` query parameter to limit results to paths containing the filter string.
      parameters:
        - description: "Optional path filter string (case-insensitive substring match)."
          in: "query"
          name: "filter"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  edges:
                    items:
                      properties:
                        source:
                          type: "string"
                        target:
                          type: "string"
                      type: "object"
                    type: "array"
                  nodes:
                    items:
                      properties:
                        backlinkCount:
                          type: "number"
                        linkCount:
                          type: "number"
                        name:
                          type: "string"
                        path:
                          type: "string"
                        tags:
                          items:
                            type: "string"
                          type: "array"
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
      summary: |
        Return the full graph structure of the vault as nodes and edges.
      tags:
        - "Graph"
  /graph/analyze/:
    get:
      description: |
        Returns total node/edge counts, orphan notes (no links in or out), hub notes (highest degree), and connected components.
      parameters:
        - description: "Number of top hubs to return (default: 10)."
          in: "query"
          name: "topN"
          required: false
          schema:
            default: 10
            type: "number"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  connectedComponents:
                    items:
                      items:
                        type: "string"
                      type: "array"
                    type: "array"
                  hubs:
                    items:
                      properties:
                        degree:
                          type: "number"
                        path:
                          type: "string"
                      type: "object"
                    type: "array"
                  orphans:
                    items:
                      type: "string"
                    type: "array"
                  totalEdges:
                    type: "number"
                  totalNodes:
                    type: "number"
                type: "object"
          description: "Success"
      summary: |
        Analyze the vault graph structure and return computed metrics.
      tags:
        - "Graph"
  "/graph/neighbors/{filename}":
    get:
      description: |
        Returns all notes within N link-hops of the specified note, similar to Obsidian's local graph view. Each node includes a depth field indicating distance from the root.
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
        - description: "Maximum link-hop depth to traverse (default: 1)."
          in: "query"
          name: "depth"
          required: false
          schema:
            default: 1
            type: "number"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  edges:
                    items:
                      properties:
                        source:
                          type: "string"
                        target:
                          type: "string"
                      type: "object"
                    type: "array"
                  nodes:
                    items:
                      properties:
                        depth:
                          type: "number"
                        name:
                          type: "string"
                        path:
                          type: "string"
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        Return the local graph neighborhood of a specific note.
      tags:
        - "Graph"
  /links/:
    delete:
      description: |
        Matches [[target]], [[target|display]], [[target#heading]], and [[target#heading|display]] patterns. Optionally restrict deletion to a specific line number.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                line:
                  description: "Optional 0-indexed line number to restrict deletion to."
                  type: "number"
                path:
                  description: "File path of the note to remove the link from."
                  type: "string"
                target:
                  description: "Target note name to match in the wiki-link."
                  type: "string"
              required:
                - "path"
                - "target"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        Remove a wiki-link from a note.
      tags:
        - "Links"
    post:
      description: |
        Creates a [[target]] or [[target|display]] link. Can optionally target a specific heading with [[target#heading]]. Position can be a specific line/character, "end" to append, or omitted to append.
      requestBody:
        content:
          application/json:
            schema:
              properties:
                displayText:
                  description: "Optional display text for the link."
                  type: "string"
                heading:
                  description: "Optional heading to link to."
                  type: "string"
                path:
                  description: "File path of the note to add the link to."
                  type: "string"
                position:
                  description: "Where to insert the link: {line, ch}, \"end\", or omit to append."
                target:
                  description: "Target note name or path for the wiki-link."
                  type: "string"
              required:
                - "path"
                - "target"
              type: "object"
        required: true
      responses:
        "200":
          description: "Success"
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Bad request"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        Insert a wiki-link into a note.
      tags:
        - "Links"
  "/links/suggest/{filename}":
    get:
      description: |
        Finds unlinked mentions — places where another note's name appears in the text but is not already wrapped in a [[wiki-link]].
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  suggestions:
                    items:
                      properties:
                        ch:
                          type: "number"
                        context:
                          type: "string"
                        line:
                          type: "number"
                        noteName:
                          type: "string"
                        notePath:
                          type: "string"
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "File not found"
      summary: |
        Suggest potential wiki-links to existing notes.
      tags:
        - "Links"
  "/links/{filename}":
    get:
      description: |
        Each link includes target path, display text, line number, character position, surrounding context text, and direction (outgoing/incoming).
      parameters:
        - description: "File path relative to vault root."
          in: "path"
          name: "filename"
          required: true
          schema:
            format: "path"
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  links:
                    items:
                      properties:
                        ch:
                          type: "number"
                        context:
                          type: "string"
                        direction:
                          enum:
                            - "outgoing"
                            - "incoming"
                          type: "string"
                        displayText:
                          type: "string"
                        line:
                          type: "number"
                        target:
                          type: "string"
                      type: "object"
                    type: "array"
                type: "object"
          description: "Success"
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
