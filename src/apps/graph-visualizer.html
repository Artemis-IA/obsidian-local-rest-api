<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vault Graph Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1e1e2e; color: #cdd6f4; }
    #container { width: 100%; height: 100%; position: relative; }
    svg { width: 100%; height: 100%; }
    #controls { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 10; }
    #controls button, #controls select { background: #313244; border: 1px solid #45475a; color: #cdd6f4; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    #controls button:hover { background: #45475a; }
    #info { position: absolute; bottom: 12px; left: 12px; background: #313244; border: 1px solid #45475a; padding: 8px 12px; border-radius: 6px; font-size: 11px; z-index: 10; }
    #tooltip { position: absolute; display: none; background: #313244; border: 1px solid #89b4fa; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; z-index: 20; max-width: 300px; }
    #tooltip .path { color: #89b4fa; font-weight: 600; }
    #tooltip .tags { color: #a6e3a1; margin-top: 4px; }
    #tooltip .stats { color: #f9e2af; margin-top: 4px; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #1e1e2e; z-index: 30; }
    #loading .spinner { width: 40px; height: 40px; border: 3px solid #45475a; border-top-color: #89b4fa; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .node { cursor: pointer; }
    .node circle { stroke: #45475a; stroke-width: 1.5; }
    .node text { font-size: 9px; fill: #bac2de; pointer-events: none; }
    .link { stroke: #45475a; stroke-opacity: 0.4; }
    .node.orphan circle { stroke: #f38ba8; stroke-dasharray: 3,2; }
    .node.hub circle { stroke: #f9e2af; stroke-width: 2.5; }
  </style>
</head>
<body>
  <div id="container">
    <div id="loading"><div class="spinner"></div></div>
    <div id="controls">
      <button id="btn-reset">Reset Zoom</button>
      <button id="btn-orphans">Highlight Orphans</button>
      <button id="btn-hubs">Highlight Hubs</button>
      <select id="filter-folder"><option value="">All folders</option></select>
    </div>
    <div id="info">Loading graph...</div>
    <div id="tooltip"></div>
    <svg id="graph"></svg>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module">
    // MCP App client — communicates with the host via postMessage
    class McpAppClient {
      constructor() {
        this._id = 0;
        this._pending = new Map();
        this._toolResult = null;
        this._toolResultResolve = null;
        this._initialized = false;
        window.addEventListener('message', (e) => this._onMessage(e));
      }

      connect() {
        // Send ui/initialize
        return this._request('ui/initialize', {
          clientInfo: { name: 'Vault Graph Visualizer', version: '1.0.0' },
          capabilities: {}
        });
      }

      waitForToolResult() {
        if (this._toolResult) {
          const r = this._toolResult;
          this._toolResult = null;
          return Promise.resolve(r);
        }
        return new Promise((resolve) => { this._toolResultResolve = resolve; });
      }

      callServerTool(name, args) {
        return this._request('tools/call', { name, arguments: args });
      }

      _request(method, params) {
        const id = ++this._id;
        return new Promise((resolve, reject) => {
          this._pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }

      _onMessage(event) {
        const msg = event.data;
        if (!msg || typeof msg !== 'object') return;

        // Response to our request
        if (msg.id && this._pending.has(msg.id)) {
          const { resolve, reject } = this._pending.get(msg.id);
          this._pending.delete(msg.id);
          if (msg.error) reject(msg.error);
          else resolve(msg.result);
          return;
        }

        // Notification from host
        if (msg.method === 'ui/toolResult' || msg.method === 'notifications/toolResult') {
          const result = msg.params;
          if (this._toolResultResolve) {
            this._toolResultResolve(result);
            this._toolResultResolve = null;
          } else {
            this._toolResult = result;
          }
        }
      }
    }

    // ── Graph Visualization ──

    const svg = d3.select('#graph');
    const container = document.getElementById('container');
    const tooltip = document.getElementById('tooltip');
    const info = document.getElementById('info');
    const loading = document.getElementById('loading');
    const filterFolder = document.getElementById('filter-folder');

    let graphData = { nodes: [], edges: [] };
    let simulation, nodeElements, linkElements, labels;
    let currentFilter = '';

    // Initialize MCP App communication
    const app = new McpAppClient();

    async function init() {
      try {
        await app.connect();
        // Wait for the tool result (graph data pushed by host)
        const toolResult = await Promise.race([
          app.waitForToolResult(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
        ]);

        if (toolResult?.content) {
          const textContent = toolResult.content.find(c => c.type === 'text');
          if (textContent) {
            graphData = JSON.parse(textContent.text);
          }
        }
      } catch (e) {
        // Fallback: call the tool directly
        try {
          const result = await app.callServerTool('graph_get', {});
          if (result?.content) {
            const textContent = result.content.find(c => c.type === 'text');
            if (textContent) graphData = JSON.parse(textContent.text);
          }
        } catch (e2) {
          // Final fallback: fetch from REST API (if same-origin)
          try {
            const res = await fetch('/graph/');
            if (res.ok) graphData = await res.json();
          } catch (e3) {
            info.textContent = 'Could not load graph data.';
            loading.style.display = 'none';
            return;
          }
        }
      }

      loading.style.display = 'none';
      renderGraph();
    }

    function renderGraph() {
      const width = container.clientWidth;
      const height = container.clientHeight;

      // Extract unique folders for filter
      const folders = new Set();
      graphData.nodes.forEach(n => {
        const parts = n.path.split('/');
        if (parts.length > 1) folders.add(parts.slice(0, -1).join('/'));
      });
      [...folders].sort().forEach(f => {
        const opt = document.createElement('option');
        opt.value = f; opt.textContent = f;
        filterFolder.appendChild(opt);
      });

      // Set up SVG
      svg.selectAll('*').remove();
      const g = svg.append('g');

      // Zoom
      const zoom = d3.zoom()
        .scaleExtent([0.1, 8])
        .on('zoom', (event) => g.attr('transform', event.transform));
      svg.call(zoom);

      document.getElementById('btn-reset').addEventListener('click', () => {
        svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
      });

      // Filter logic
      function getFilteredData() {
        let nodes = graphData.nodes;
        if (currentFilter) {
          nodes = nodes.filter(n => n.path.startsWith(currentFilter + '/'));
        }
        const nodePaths = new Set(nodes.map(n => n.path));
        const edges = graphData.edges.filter(e => nodePaths.has(e.source || e.from) && nodePaths.has(e.target || e.to));
        return { nodes, edges };
      }

      function draw() {
        g.selectAll('*').remove();
        const data = getFilteredData();

        // Normalize edges
        const edges = data.edges.map(e => ({
          source: e.source || e.from,
          target: e.target || e.to,
        }));

        // Compute degree
        const degree = new Map();
        edges.forEach(e => {
          degree.set(e.source, (degree.get(e.source) || 0) + 1);
          degree.set(e.target, (degree.get(e.target) || 0) + 1);
        });

        const nodes = data.nodes.map(n => ({
          ...n,
          id: n.path,
          degree: degree.get(n.path) || 0,
        }));

        const nodeById = new Map(nodes.map(n => [n.id, n]));

        // Color by folder
        const folderColors = d3.scaleOrdinal(d3.schemeTableau10);

        // Force simulation
        if (simulation) simulation.stop();
        simulation = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(edges).id(d => d.id || d.path).distance(60))
          .force('charge', d3.forceManyBody().strength(-120))
          .force('center', d3.forceCenter(width / 2, height / 2))
          .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.degree + 1) * 4 + 8));

        // Links
        linkElements = g.append('g')
          .selectAll('line')
          .data(edges)
          .join('line')
          .attr('class', 'link')
          .attr('stroke-width', 1);

        // Nodes
        const nodeGroup = g.append('g')
          .selectAll('g')
          .data(nodes)
          .join('g')
          .attr('class', d => {
            let cls = 'node';
            if (d.degree === 0) cls += ' orphan';
            if (d.degree >= 10) cls += ' hub';
            return cls;
          })
          .call(d3.drag()
            .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
            .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
          );

        nodeGroup.append('circle')
          .attr('r', d => Math.sqrt(d.degree + 1) * 3 + 3)
          .attr('fill', d => {
            const folder = d.path.includes('/') ? d.path.split('/')[0] : '_root';
            return folderColors(folder);
          });

        nodeGroup.append('text')
          .attr('dx', d => Math.sqrt(d.degree + 1) * 3 + 6)
          .attr('dy', 3)
          .text(d => d.name)
          .style('display', d => d.degree >= 5 ? 'block' : 'none');

        // Tooltip
        nodeGroup.on('mouseover', (event, d) => {
          tooltip.style.display = 'block';
          tooltip.innerHTML = `
            <div class="path">${d.path}</div>
            ${d.tags && d.tags.length ? `<div class="tags">Tags: ${d.tags.join(', ')}</div>` : ''}
            <div class="stats">Links: ${d.linkCount || 0} out, ${d.backlinkCount || 0} in (degree: ${d.degree})</div>
          `;
        }).on('mousemove', (event) => {
          tooltip.style.left = (event.pageX + 12) + 'px';
          tooltip.style.top = (event.pageY - 12) + 'px';
        }).on('mouseout', () => {
          tooltip.style.display = 'none';
        });

        // Tick
        simulation.on('tick', () => {
          linkElements
            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
          nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // Info
        const orphans = nodes.filter(n => n.degree === 0).length;
        const hubs = nodes.filter(n => n.degree >= 10).length;
        info.textContent = `${nodes.length} notes, ${edges.length} links | ${orphans} orphans, ${hubs} hubs`;
      }

      draw();

      // Filter
      filterFolder.addEventListener('change', (e) => {
        currentFilter = e.target.value;
        draw();
      });

      // Highlight controls
      document.getElementById('btn-orphans').addEventListener('click', () => {
        g.selectAll('.node circle')
          .transition().duration(300)
          .attr('opacity', function() {
            return d3.select(this.parentNode).classed('orphan') ? 1 : 0.15;
          });
        g.selectAll('.link').transition().duration(300).attr('stroke-opacity', 0.05);
        setTimeout(() => {
          g.selectAll('.node circle').transition().duration(500).attr('opacity', 1);
          g.selectAll('.link').transition().duration(500).attr('stroke-opacity', 0.4);
        }, 3000);
      });

      document.getElementById('btn-hubs').addEventListener('click', () => {
        g.selectAll('.node circle')
          .transition().duration(300)
          .attr('opacity', function() {
            return d3.select(this.parentNode).classed('hub') ? 1 : 0.15;
          });
        g.selectAll('.link').transition().duration(300).attr('stroke-opacity', 0.05);
        setTimeout(() => {
          g.selectAll('.node circle').transition().duration(500).attr('opacity', 1);
          g.selectAll('.link').transition().duration(500).attr('stroke-opacity', 0.4);
        }, 3000);
      });
    }

    init();
  </script>
</body>
</html>
